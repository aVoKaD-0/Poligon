[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "poligon-intelligence"
version = "0.1.0"
description = "Local text Intelligence MVP; proposed v1 integration"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.4"]

[project.optional-dependencies]
grpc = ["grpcio==1.76.0", "grpcio-tools==1.76.0", "protobuf==6.33.0"]
dev = ["jsonschema==4.25.1"]

[project.scripts]
poligon-intelligence = "poligon_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["poligon_intelligence*", "poligon*"]
namespaces = true
