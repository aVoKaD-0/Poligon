port: 4222
http: 8222
jetstream { store_dir: /data, max_memory_store: 128MB, max_file_store: 8GB }
authorization {
  users: [
    { user: platform, password: $NATS_PLATFORM_PASSWORD, permissions: {
      publish: ["poligon.cmd.session.>", "poligon.cmd.evaluation.>", "$JS.API.STREAM.INFO.POLIGON_EXECUTION","$JS.API.STREAM.INFO.POLIGON_EVALUATION","$JS.API.STREAM.INFO.POLIGON_EVENTS","$JS.API.STREAM.CREATE.POLIGON_EXECUTION","$JS.API.STREAM.CREATE.POLIGON_EVALUATION","$JS.API.STREAM.CREATE.POLIGON_EVENTS", "$JS.API.CONSUMER.CREATE.POLIGON_EVENTS.>","$JS.API.CONSUMER.DURABLE.CREATE.POLIGON_EVENTS.>","$JS.API.CONSUMER.INFO.POLIGON_EVENTS.>","$JS.API.CONSUMER.DELETE.POLIGON_EVENTS.>","$JS.API.CONSUMER.MSG.NEXT.POLIGON_EVENTS.>", "_INBOX.>", "$JS.ACK.POLIGON_EVENTS.>"]
      subscribe: ["_INBOX.>"]
    } }
    { user: runner, password: $NATS_RUNNER_PASSWORD, permissions: {
      publish: ["poligon.evt.session.>", "$JS.API.CONSUMER.CREATE.POLIGON_EXECUTION.>","$JS.API.CONSUMER.DURABLE.CREATE.POLIGON_EXECUTION.>","$JS.API.CONSUMER.INFO.POLIGON_EXECUTION.>","$JS.API.CONSUMER.DELETE.POLIGON_EXECUTION.>","$JS.API.CONSUMER.MSG.NEXT.POLIGON_EXECUTION.>","$JS.API.STREAM.INFO.POLIGON_EXECUTION", "$JS.ACK.POLIGON_EXECUTION.>", "_INBOX.>"]
      subscribe: ["_INBOX.>"]
    } }
    { user: intelligence, password: $NATS_INTELLIGENCE_PASSWORD, permissions: {
      publish: ["poligon.evt.evaluation.>", "$JS.API.CONSUMER.CREATE.POLIGON_EVALUATION.>","$JS.API.CONSUMER.DURABLE.CREATE.POLIGON_EVALUATION.>","$JS.API.CONSUMER.INFO.POLIGON_EVALUATION.>","$JS.API.CONSUMER.DELETE.POLIGON_EVALUATION.>","$JS.API.CONSUMER.MSG.NEXT.POLIGON_EVALUATION.>","$JS.API.STREAM.INFO.POLIGON_EVALUATION", "$JS.ACK.POLIGON_EVALUATION.>", "_INBOX.>"]
      subscribe: ["_INBOX.>"]
    } }
  ]
}
