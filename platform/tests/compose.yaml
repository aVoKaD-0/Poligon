services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: test-only
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d postgres']
      interval: 2s
      timeout: 2s
      retries: 20
  nats:
    image: nats:2.11.9-alpine
    command: ['-js', '-m', '8222']
    ports: ['127.0.0.1:54222:4222']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8222/healthz']
      interval: 2s
      timeout: 2s
      retries: 20
